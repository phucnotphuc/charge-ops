name: chargeops
x-env: &env
  MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
  LOG_DIR: /logs
  SIMULATOR_SECRET: ${SIMULATOR_SECRET:?Run scripts/init_env.py first}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Run scripts/init_env.py first}
  OPERATOR_SECRET: ${OPERATOR_SECRET:?Add OPERATOR_SECRET to .env (see .env.example)}
  DD_MONITOR_ID: ${DD_MONITOR_ID:-}
  DD_TRIAL_ID: ${DD_TRIAL_ID:-hackathon-2026}
  OPERATOR_USERNAME: ${OPERATOR_USERNAME:-}
  OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
  DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
  DD_INSTRUMENTATION_TELEMETRY_ENABLED: ${DD_INSTRUMENTATION_TELEMETRY_ENABLED:-false}
  DD_AGENT_HOST: datadog
  DD_ENV: hackathon
  DD_VERSION: ${APP_VERSION:-0.1.0}
x-app: &app
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-0.1.0}
  volumes:
    - app-logs:/logs
  depends_on:
    mongo:
      condition: service_healthy
  restart: unless-stopped
services:
  mongo:
    image: mongo:8.0.5
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Idempotent one-node replica set: initiate on first run, healthy once primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    <<: *app
    environment: {<<: *env, DD_SERVICE: chargeops-api}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ./web
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/Caddyfile.web:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  worker:
    <<: *app
    environment: {<<: *env, DD_SERVICE: chargeops-worker}
    command: [python, -m, chargeops.worker]
  simulator:
    <<: *app
    environment: {<<: *env, DD_SERVICE: chargeops-simulator}
    command: [python, -m, chargeops.simulator]
    depends_on:
      api:
        condition: service_healthy
  datadog:
    image: gcr.io/datadoghq/agent:7.66.1
    profiles: [observability]
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: chargeops-local
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
    volumes:
      - app-logs:/logs:ro
      - ./infra/datadog-logs.yaml:/etc/datadog-agent/conf.d/chargeops.d/conf.yaml:ro
  webhook-gateway:
    image: caddy:2.9.1-alpine
    profiles: [observability]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
  tunnel:
    image: cloudflare/cloudflared:2025.2.1
    profiles: [observability]
    command: [tunnel, --no-autoupdate, --url, "http://webhook-gateway:8081"]
    depends_on: [webhook-gateway]
volumes:
  mongo-data:
  app-logs:
